<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회식 자리 뽑기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h2 class="panel-title">참석자 <span id="count"></span></h2>
      <ul id="roster" class="roster"></ul>
    </aside>

    <main class="stage">
      <header class="topbar">
        <h1>회식 자리 뽑기</h1>
        <p id="status" class="status" aria-live="polite"></p>
      </header>

      <div class="canvas-frame">
        <canvas id="game" aria-label="횟집 자리 배치 게임 화면"></canvas>
      </div>

      <div class="toolbar">
        <div class="group" role="group" aria-label="테이블 종류">
          <button type="button" id="btnRound" class="btn toggle">원형 테이블</button>
          <button type="button" id="btnRect" class="btn toggle">직사각형 테이블</button>
          <button type="button" id="btnRect6" class="btn toggle">6인 테이블 ×3</button>
        </div>
        <div class="group">
          <button type="button" id="btnStart" class="btn primary">시작</button>
          <button type="button" id="btnRetry" class="btn">다시하기</button>
          <button type="button" id="btnSave" class="btn">결과 PNG 저장</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 인터넷 없이 더블클릭으로 실행되도록 일반 스크립트로 불러옵니다 -->
  <script src="characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
